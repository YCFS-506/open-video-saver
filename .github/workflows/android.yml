name: Android APK
on:
  push:
    branches: [main, codex/android-app]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVideoSaver-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
